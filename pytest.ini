[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    smoke: real-dependency smoke tests (require jieba, rank_bm25, etc.)

# 默认生成 HTML 测试报告 + 覆盖率报告，输出到 test-reports/
# --cov-context=test: 每行代码记录"被哪个测试覆盖"，在 coverage HTML 中可点击查看
addopts =
    --html=test-reports/report.html
    --self-contained-html
    --cov=core
    --cov=db
    --cov-context=test
    --cov-report=html:test-reports/coverage
    --cov-report=term-missing:skip-covered
