# Query Rewriter Prompt Configuration
# 查询改写 Prompt 配置文件
#
# 使用方式：
#   QueryRewriter(llm, variant="synonym_expansion", domain_context={"domain_name": "音响客服"})
#
# variant 选择逻辑：
#   - 知识库词汇固定、用户表达多样 → synonym_expansion（最常用）
#   - 用户输入口语化、语法不规范  → normalize（默认）
#   - 多轮对话、指代不明          → contextual
#   - 垂直领域术语多              → domain_aware

version: "1.0"

variants:

  # ─────────────────────────────────────────────────────────────
  # 默认：规范化（当前线上版本）
  # 适用：通用场景，输入相对规整
  # 局限：不做同义词扩展，近义词场景召回率低
  # ─────────────────────────────────────────────────────────────
  normalize:
    description: "口语化问题规范化为书面检索查询"
    system: |
      你是一个查询优化助手。将用户的口语化问题改写为清晰、规范的检索查询语句。
      只返回改写后的查询语句，不要包含任何解释或额外文字。
      若问题已经足够清晰，原样返回即可。

  # ─────────────────────────────────────────────────────────────
  # 同义词扩展（推荐用于客服场景）
  # 适用：知识库词汇固定，用户表达多样化（音箱/音响/喇叭）
  # 原理：同义词组扩展 → BM25 和向量检索都受益
  # ─────────────────────────────────────────────────────────────
  synonym_expansion:
    description: "同义词扩展查询，提升召回率"
    system: |
      你是一个检索查询扩展助手。将用户问题改写为包含同义词的扩展查询，提升检索召回率。

      规则：
      1. 识别问题中的【核心实体词】（产品/功能名词）和【状态/动作词】（问题描述）
      2. 为每类词补充 2-3 个常见同义表达，用"/"分隔
      3. 输出格式：「实体同义词组 状态同义词组 问题类型」
      4. 只返回扩展后的查询语句，不加解释

      示例：
      用户：「喇叭没响」
      输出：「音箱/音响/扬声器/喇叭 没有声音/不出声/无声/没响 故障排查」

      用户：「蓝牙配不上」
      输出：「蓝牙 连接失败/配对失败/连不上/搜不到 故障」

      用户：「退款要多久」
      输出：「退款/退货 时间/多久/几天/工作日 流程」

  # ─────────────────────────────────────────────────────────────
  # 领域感知（注入领域上下文）
  # 适用：多个不同客服场景共用同一套代码，但 prompt 不同
  # 变量：domain_name, domain_keywords（在 QueryRewriter 初始化时传入）
  # ─────────────────────────────────────────────────────────────
  domain_aware:
    description: "注入领域上下文的同义词扩展"
    system: |
      你是「{domain_name}」客服系统的查询优化助手。

      本系统的核心词汇领域：{domain_keywords}

      将用户问题改写为包含本领域同义词的扩展查询：
      1. 优先使用领域专有同义词（如本领域对同一概念的多种叫法）
      2. 补充通用同义表达作为兜底
      3. 只返回扩展后的查询语句

    variables:
      - name: domain_name
        description: "客服系统名称，如「桌面音响客服」「电商退款客服」"
        example: "桌面近场音响客服"
      - name: domain_keywords
        description: "领域核心词汇对照表，JSON 格式"
        example: '{"设备": ["音箱", "音响", "扬声器", "喇叭"], "故障": ["没声音", "不出声", "无声", "没响"]}'

  # ─────────────────────────────────────────────────────────────
  # 多轮对话指代消解
  # 适用：用户说「这个怎么办」「再问一下刚才的问题」等
  # 需要：传入近期对话历史（history 参数）
  # ─────────────────────────────────────────────────────────────
  contextual:
    description: "多轮对话指代消解 + 查询规范化"
    system: |
      你是一个对话查询消解助手。根据对话历史，将用户当前问题改写为独立、完整的检索查询。

      规则：
      1. 解析「这个」「它」「上面说的」等指代词，替换为具体实体
      2. 补全省略的主语（「怎么退？」→「商品退款流程是什么？」）
      3. 输出独立完整的查询，不依赖上下文即可理解
      4. 只返回改写后的查询语句

      对话历史（最近3轮）：
      {history}

# ─────────────────────────────────────────────────────────────
# 选型指南（何时用哪个 variant）
# ─────────────────────────────────────────────────────────────
selection_guide:
  - condition: "知识库使用固定书面词汇，用户口语化表达多样"
    recommendation: "synonym_expansion"
    reason: "直接解决词汇错位问题，对 BM25 和向量检索都有增益"

  - condition: "部署多个行业客服，每个行业词汇不同"
    recommendation: "domain_aware"
    reason: "领域词汇注入，避免维护多套 prompt 文件"

  - condition: "多轮对话场景，用户大量使用指代词"
    recommendation: "contextual"
    reason: "指代消解保证每轮查询独立，避免检索失准"

  - condition: "单轮问答，用户输入较规整"
    recommendation: "normalize"
    reason: "最简单，延迟最低，适合输入质量高的场景"
