[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    smoke: real-dependency smoke tests (require jieba, rank_bm25, etc.)

# 默认生成 HTML 测试报告 + 覆盖率报告，输出到 test-reports/
addopts =
    --html=test-reports/report.html
    --self-contained-html
    --cov=core
    --cov=db
    --cov-report=html:test-reports/coverage
    --cov-report=term-missing:skip-covered
